[project]
name = "ops-agent-mcp"
version = "0.1.0"
description = "Agente de operaciones con LangGraph, herramientas expuestas por MCP y aprobación humana para acciones sensibles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "mcp[cli]>=2.0",
    "openai>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
dev = ["pytest>=8.0", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
